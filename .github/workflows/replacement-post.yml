name: Replacement SNS posts

on:
  push:
    paths:
      - "replacement_retry_trigger.txt"

concurrency:
  group: sns-replacement-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest posting state
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Publish replacement posts
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: python cloud_publish.py
      - name: Save posting state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x_schedule_live.json instagram_schedule_live.json instagram_schedule_2026-10-05_onward.csv reservation_queue.json reservation_maintenance_report.json generated_terms.json
          if [ -d "SNS投稿用画像/generated" ]; then git add "SNS投稿用画像/generated"; fi
          git diff --cached --quiet || git commit -m "Save replacement posting state"
          git push
