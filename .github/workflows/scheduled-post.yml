name: Scheduled SNS posts

on:
  push:
    paths:
      - "manual_repost_trigger.txt"
  schedule:
    # 主実行: 10:03 JST。GitHubの毎時ちょうどの混雑を避ける。
    - cron: "3 1 * * *"
    # 予備実行: 10:20 JST。主実行が未起動・遅延した場合に確認する。
    # 投稿済みの予約キーは状態ファイルでスキップし、重複投稿を防ぐ。
    - cron: "20 1 * * *"
  workflow_dispatch:

concurrency:
  group: sns-scheduled-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest posting state
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish due posts
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: python cloud_publish.py
      - name: Save posting state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x_schedule_live.json instagram_schedule_live.json
          git diff --cached --quiet || git commit -m "Update posting state"
          git push
