name: Scheduled SNS posts

on:
  push:
    paths:
      - "manual_repost_trigger.txt"
  schedule:
    # GitHub Actionsのscheduledは遅延・欠落することがあるため、10時台に繰り返し確認する。
    # いずれかの実行が成功すれば、状態ファイルで投稿済み予約キーをスキップし、重複投稿を防ぐ。
    - cron: "0 23 * * *"   # 08:00 JST 予約バッファ先行確認
    - cron: "30 0 * * *"   # 09:30 JST 予約バッファ最終確認
    - cron: "3 1 * * *"    # 10:03 JST 主実行
    - cron: "*/5 1 * * *"  # 10:00〜10:55 JST 5分間隔の予備実行
    - cron: "0 2 * * *"    # 11:00 JST 最終予備実行
  workflow_dispatch:

concurrency:
  group: sns-scheduled-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest posting state
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt
      - name: Generate image and caption reserve candidates
        run: python generate_assets.py
      - name: Maintain 3-day reservation horizon
        run: python maintain_reservations.py
      - name: Refill after scheduling
        run: python generate_assets.py
      - name: Recheck reservation horizon
        run: python maintain_reservations.py
      - name: Publish due posts
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: python cloud_publish.py
      - name: Save posting state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x_schedule_live.json instagram_schedule_live.json instagram_schedule_2026-10-05_onward.csv reservation_queue.json reservation_maintenance_report.json generated_terms.json SNS投稿用画像/generated
          git diff --cached --quiet || git commit -m "Update posting state"
          git push
