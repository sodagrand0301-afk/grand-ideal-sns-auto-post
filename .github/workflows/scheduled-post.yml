name: Scheduled SNS posts

on:
  push:
    paths:
      - "manual_repost_trigger.txt"
  schedule:
    # GitHub Actionsのscheduledは遅延・欠落することがあるため、10時台に複数回確認する。
    # すでに投稿済みの予約キーは状態ファイルでスキップし、重複投稿を防ぐ。
    - cron: "3 1 * * *"   # 10:03 JST 主実行
    - cron: "10 1 * * *"  # 10:10 JST 予備
    - cron: "20 1 * * *"  # 10:20 JST 予備
    - cron: "30 1 * * *"  # 10:30 JST 予備
    - cron: "40 1 * * *"  # 10:40 JST 予備
    - cron: "50 1 * * *"  # 10:50 JST 最終予備
  workflow_dispatch:

concurrency:
  group: sns-scheduled-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest posting state
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish due posts
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: python cloud_publish.py
      - name: Save posting state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x_schedule_live.json instagram_schedule_live.json
          git diff --cached --quiet || git commit -m "Update posting state"
          git push
